# kzen-launcher runtime config (bundled into the jar as a classpath resource, so it is readable
# regardless of the launcher's working directory).
#
# Project archetype (template) source: candidates are tried in order; the first that resolves wins.
# A relative/local path is used only if it exists (resolved against the launcher's working directory);
# an http(s) URL is used as-is. This lets one file cover every run mode:
#   .1  standalone launcher run   (working dir = kzen-launcher repo root)      -> ../kzen-project/...
#   .2  kzen-shell-spawned run    (working dir = <workspace>/work/kzen-launcher/<version>/) -> ../../../kzen-project/...
#   .3  released build            (no local source tree)                        -> published GitHub artifact
#
# On any machine without the sibling source tree, .1/.2 simply don't resolve and .3 is used.
# On a version bump, update the version in all three lines.

archetype.project.1=../kzen-project/kzen-project-jvm/build/dist/kzen-project-0.30.0-SNAPSHOT.zip
archetype.project.2=../../../kzen-project/kzen-project-jvm/build/dist/kzen-project-0.30.0-SNAPSHOT.zip
archetype.project.3=https://github.com/alexoooo/kzen-project/releases/download/v0.30.0/kzen-project-0.30.0.zip
